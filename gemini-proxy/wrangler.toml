name = "papanda-gemini-proxy"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# Provider + model can be changed here without touching the app.
# DEFAULT_PROVIDER selects which upstream is used when the app doesn't ask for a
# specific one: "gemini" | "cerebras" | "groq". Only the matching *_API_KEY secret
# needs to be set for whichever provider(s) you actually use.
# FALLBACK_PROVIDER is tried automatically (same request) if the primary call
# fails or comes back empty — a Gemini outage/quota hit no longer fails the
# request outright, it silently retries on Cerebras.
[vars]
DEFAULT_PROVIDER = "gemini"
FALLBACK_PROVIDER = "cerebras"
GEMINI_MODEL = "gemini-3.5-flash-lite"
CEREBRAS_MODEL = "gpt-oss-120b"
GROQ_MODEL = "openai/gpt-oss-120b"
PER_INSTALL_HOURLY = "40"
PER_INSTALL_DAILY = "200"
GLOBAL_DAILY = "1500"

# Transactional quotas; migration is applied by wrangler deploy.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaLimiter"

[[migrations]]
tag = "v1-quota"
new_sqlite_classes = ["QuotaLimiter"]

# API keys are secrets, not vars — set only the ones you use:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put CEREBRAS_API_KEY
#   npx wrangler secret put GROQ_API_KEY
