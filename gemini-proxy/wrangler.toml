name = "papanda-gemini-proxy"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# Model can be changed here without touching the app.
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
PER_INSTALL_HOURLY = "40"
PER_INSTALL_DAILY = "200"
GLOBAL_DAILY = "1500"

# Rate-limit counters. Create with:  npx wrangler kv namespace create RL
# then paste the printed id below.
[[kv_namespaces]]
binding = "RL"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# GEMINI_API_KEY is a secret, not a var:  npx wrangler secret put GEMINI_API_KEY
